version: 1
course: "Scienze Motorie eCampus 2026/2027"
language: "it"
principles:
  - "Usa il materiale dello studente come fonte primaria per i fatti d'esame."
  - "Semplifica il linguaggio senza eliminare definizioni, classificazioni, sequenze, eccezioni o valori numerici."
  - "Se aggiungi conoscenza generale per chiarire un concetto, separala come Chiarimento e non presentarla come contenuto della dispensa."
  - "Distingui termini simili e segnala relazioni causa-effetto."
  - "Per meccanismi fisiologici e biomeccanici usa sequenze ordinate."
  - "Evita introduzioni verbose e ripetizioni."
