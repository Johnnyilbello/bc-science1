[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bc-science"
version = "0.9.9"
description = "Local-first study assistant for eCampus Scienze Motorie"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.28,<1",
  "numpy>=2,<3",
  "psutil>=6,<8",
  "pymupdf>=1.26,<2",
  "python-docx>=1.1,<2",
  "reportlab>=4.4,<6",
  "PyYAML>=6,<7",
  "rich>=13,<15",
  "typer>=0.15,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
bc-science = "bc_science.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bc_science"]

[tool.hatch.build.targets.wheel.force-include]
"knowledge" = "bc_science/knowledge"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
